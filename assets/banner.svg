<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="laptop-migration-toolkit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" rx="26" fill="url(#bg)"/>
  <circle cx="1120" cy="70" r="220" fill="url(#glow2)"/>
  <circle cx="180" cy="300" r="240" fill="url(#glow1)"/>

  <g opacity="0.35" stroke="#94a3b8" stroke-width="1.5" fill="none">
    <rect x="60" y="250" width="46" height="30" rx="4"/>
    <rect x="1180" y="252" width="46" height="30" rx="4"/>
  </g>

  <text x="72" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#38bdf8">&#128187; laptop-migration-toolkit</text>

  <text x="70" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#title)">Move your whole Windows setup</text>
  <text x="72" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Apps &#183; settings &#183; visuals &#183; dev &amp; agent configs &#183; Wi-Fi &#183; fonts &#8212; old laptop to new</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="72" y="262" width="250" height="52" rx="26" fill="url(#g1)" opacity="0.22" stroke="#38bdf8" stroke-width="2"/>
    <text x="197" y="295" fill="#7dd3fc" text-anchor="middle">1. COLLECT &#128230;</text>

    <rect x="342" y="262" width="250" height="52" rx="26" fill="url(#g2)" opacity="0.22" stroke="#f472b6" stroke-width="2"/>
    <text x="467" y="295" fill="#f9a8d4" text-anchor="middle">2. VERIFY &#128269;</text>

    <rect x="612" y="262" width="250" height="52" rx="26" fill="url(#g3)" opacity="0.22" stroke="#34d399" stroke-width="2"/>
    <text x="737" y="295" fill="#6ee7b7" text-anchor="middle">3. RESTORE &#9889;</text>
  </g>

  <text x="1206" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#94a3b8" text-anchor="end">PowerShell 5.1 &#183; Windows 10/11 &#183; MIT</text>
</svg>
